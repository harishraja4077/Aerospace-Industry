<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Not Found | Stackly Aerospace</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="preloader">
    <div class="preloader-logo">STACKLY</div>
    <div class="preloader-bar"></div>
  </div>
  <div class="cursor-glow"></div>
  <canvas id="particles-canvas"></canvas>
  <div class="page-transition"></div>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">
      <img src="images/logo.webp" alt="Stackly">
    </a>
    
    <div class="nav-cta">
      <a href="signin.html" class="btn btn-ghost btn-sm">Sign In</a>
      <a href="signup.html" class="btn btn-primary btn-sm">Get Started</a>
    </div>
    <button class="mobile-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>

  <div class="error-wrapper">
    <div class="error-bg" style="background-image:url('images/hero-space.webp');background-size:cover;background-position:center;">
      <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,22,40,0.92),rgba(10,22,40,0.85),rgba(10,22,40,0.92));"></div>
      <div class="auth-bg-gradient"></div>
      <div class="auth-bg-gradient"></div>
      <div class="hero-grid-overlay"></div>
    </div>
    <div class="error-content">
      <div class="error-code reveal stagger-1">404</div>
      <h1 class="error-title reveal stagger-2">Lost in Space</h1>
      <p class="error-text reveal stagger-3">
        The page you're looking for has drifted out of orbit. It may have been moved, deleted, or perhaps it never existed in this timeline.
      </p>
      <div class="error-actions reveal stagger-4">
        <a href="index.html" class="btn btn-primary btn-lg"><i class="fas fa-home"></i> Return to Base</a>
        <a href="contact.html" class="btn btn-secondary btn-lg"><i class="fas fa-headset"></i> Contact Mission Control</a>
        <button onclick="if(window.history.length>1){window.history.back();}else{window.location.href='index.html';}" class="btn btn-ghost btn-lg"><i class="fas fa-arrow-left"></i> Go Back</button>
      </div>

     
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
