<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Stackly Aerospace</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .auth-wrapper { opacity: 1; }
    .auth-card {
      opacity: 0;
      transform: scale(0.9) translateY(30px);
      animation: auth-card-in 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s forwards;
    }
    .auth-card .auth-logo { opacity: 0; animation: auth-fade-up 0.6s ease 0.5s forwards; }
    .auth-card h2 { opacity: 0; animation: auth-fade-up 0.6s ease 0.6s forwards; }
    .auth-card .auth-subtitle { opacity: 0; animation: auth-fade-up 0.6s ease 0.65s forwards; }
    .auth-card .auth-social-btns { opacity: 0; animation: auth-fade-up 0.6s ease 0.7s forwards; }
    .auth-card .auth-divider { opacity: 0; animation: auth-fade-up 0.6s ease 0.75s forwards; }
    .auth-card .form-group:nth-child(1) { opacity: 0; animation: auth-fade-up 0.6s ease 0.8s forwards; }
    .auth-card .form-group:nth-child(2) { opacity: 0; animation: auth-fade-up 0.6s ease 0.85s forwards; }
    .auth-card .form-check { opacity: 0; animation: auth-fade-up 0.6s ease 0.9s forwards; }
    .auth-card button[type="submit"] { opacity: 0; animation: auth-fade-up 0.6s ease 0.95s forwards; }
    .auth-card .auth-footer { opacity: 0; animation: auth-fade-up 0.6s ease 1s forwards; }

    .auth-bg-gradient:nth-child(1) { animation: float 8s ease-in-out infinite; }
    .auth-bg-gradient:nth-child(2) { animation: float-delay 10s ease-in-out infinite; }

    @keyframes auth-card-in {
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes auth-fade-up {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-icon-group { position: relative; }
    .input-icon-group .input-icon {
      position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 0.9rem; pointer-events: none; z-index: 2;
    }
    .input-icon-group input {
      padding-left: 2.7rem !important;
    }
    .input-icon-group .pw-toggle {
      position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 0.9rem; padding: 6px; border-radius: 6px; z-index: 2;
      transition: color 0.2s ease, background 0.2s ease;
    }
    .input-icon-group .pw-toggle:hover {
      color: var(--accent); background: rgba(0,212,255,0.08);
    }
    .input-icon-group input.pw-input { padding-right: 2.7rem !important; }

    .auth-card .btn-primary.btn-lg {
      position: relative; overflow: hidden; font-size: 1rem; padding: 1rem 2rem;
      border-radius: 12px; font-weight: 700; letter-spacing: 0.5px;
    }
    .auth-card .btn-primary.btn-lg::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }
    .auth-card .btn-primary.btn-lg:hover::before { left: 100%; }

    .back-home-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 1.1rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
      color: var(--text-secondary); background: rgba(255,255,255,0.05);
      border: 1px solid var(--border); text-decoration: none; cursor: pointer;
      transition: all 0.3s ease; font-family: 'Inter', sans-serif; margin-bottom: 1rem;
    }
    .back-home-btn:hover {
      color: var(--accent); border-color: var(--accent);
      background: rgba(0,212,255,0.08); transform: translateX(-3px);
    }

    .role-toggle { display: flex; gap: 0; margin: 0 0 1.2rem; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--border); }
    .role-toggle-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.7rem 1rem; font-size: 0.88rem; font-weight: 600; font-family: 'Rajdhani', sans-serif;
      background: var(--primary); color: var(--text-muted); border: none; cursor: pointer;
      transition: all 0.35s ease; position: relative; letter-spacing: 0.3px;
    }
    .role-toggle-btn:not(:last-child) { border-right: 1.5px solid var(--border); }
    .role-toggle-btn.active {
      background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(6,182,212,0.1));
      color: var(--accent); box-shadow: inset 0 0 20px rgba(0,212,255,0.08);
    }
    .role-toggle-btn:not(.active):hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
    .role-toggle-btn i { font-size: 0.9rem; }
    #signin-role { display: none; }
  </style>
</head>
<body>
  <div class="page-transition"></div>

  <div class="auth-wrapper">
    <div class="auth-bg">
      <div class="auth-bg-gradient"></div>
      <div class="auth-bg-gradient"></div>
      <div class="hero-grid-overlay"></div>
    </div>

    <div class="auth-card">
      <a href="index.html" class="back-home-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

      <div class="auth-logo">
        <a href="index.html">
          <div style="text-align:center;">
            <img src="images/logo.webp" alt="Stackly">
          </div>
        </a>
      </div>

      <h2 style="font-family:'Orbitron',sans-serif;font-size:1.6rem;font-weight:800;text-align:center;margin-bottom:0.5rem;">Welcome Back</h2>
      <p class="auth-subtitle" style="text-align:center;color:var(--text-secondary);font-size:0.9rem;margin-bottom:1rem;">Sign in to access your mission dashboard. <a href="signup.html" style="color:var(--accent);text-decoration:none;font-weight:600;">Create an account</a></p>

      <div style="text-align:center;margin-bottom:1.5rem;">
        <img src="images/satellite-control.webp" alt="Satellite Operations" style="width:100%;max-height:140px;object-fit:cover;border-radius:12px;border:1px solid var(--border);opacity:0.85;">
      </div>

      <div class="role-toggle" id="role-toggle">
        <button type="button" class="role-toggle-btn active" data-role="user"><i class="fas fa-user"></i> User</button>
        <button type="button" class="role-toggle-btn" data-role="admin"><i class="fas fa-shield"></i> Admin</button>
      </div>
      <input type="hidden" id="signin-role" value="user">

      <form class="auth-form" onsubmit="event.preventDefault();const email=this.querySelector('input[type=email]').value;const btn=this.querySelector('button[type=submit]');const role=document.getElementById('signin-role').value;localStorage.setItem('userEmail',email);btn.innerHTML='<i class=\'fas fa-spinner fa-spin\'></i> Signing in...';btn.disabled=true;setTimeout(()=>{btn.innerHTML='<i class=\'fas fa-check\'></i> Success!';btn.style.background='var(--success)';setTimeout(()=>window.location.href=role==='admin'?'admin/admin-dashboard.html':'user/user-dashboard.html',800)},1500)">
        <div class="form-group">
          <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text-primary);margin-bottom:0.5rem;font-family:'Rajdhani',sans-serif;">Email Address</label>
          <div class="input-icon-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" placeholder="you@company.com" required style="width:100%;padding:0.85rem 1rem 0.85rem 2.7rem;background:var(--primary);border:1.5px solid var(--border);border-radius:10px;color:var(--text-primary);font-size:0.92rem;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.3s ease,box-shadow 0.3s ease;">
          </div>
        </div>

        <div class="form-group">
          <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text-primary);margin-bottom:0.5rem;font-family:'Rajdhani',sans-serif;">Password</label>
          <div class="input-icon-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" placeholder="Enter your password" required id="signin-password" class="pw-input" style="width:100%;padding:0.85rem 1rem 0.85rem 2.7rem;background:var(--primary);border:1.5px solid var(--border);border-radius:10px;color:var(--text-primary);font-size:0.92rem;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.3s ease,box-shadow 0.3s ease;">
            <button type="button" class="pw-toggle" onclick="const p=document.getElementById('signin-password');p.type=p.type==='password'?'text':'password';this.querySelector('i').classList.toggle('fa-eye');this.querySelector('i').classList.toggle('fa-eye-slash')"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;">
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:var(--text-secondary);cursor:pointer;">
            <input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px;"> Remember me
          </label>
          <a href="404.html" style="font-size:0.85rem;color:var(--accent);text-decoration:none;font-weight:500;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">Sign In</button>
      </form>

      <div class="auth-footer" style="text-align:center;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border);">
        <p style="font-size:0.88rem;color:var(--text-secondary);">Don't have an account? <a href="signup.html" style="color:var(--accent);text-decoration:none;font-weight:600;">Create one now</a></p>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.auth-card input').forEach(input => {
      input.addEventListener('focus', function() {
        this.style.borderColor = 'var(--accent)';
        this.style.boxShadow = '0 0 0 3px rgba(0,212,255,0.15)';
      });
      input.addEventListener('blur', function() {
        this.style.borderColor = 'var(--border)';
        this.style.boxShadow = 'none';
      });
    });

    document.querySelectorAll('.role-toggle-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.role-toggle-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('signin-role').value = this.dataset.role;
      });
    });
  </script>
  <script src="js/main.js"></script>
</body>
</html>
